<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodNow — Criar conta</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 85% 15%, rgba(150, 20, 45, 0.18), transparent 30%),
                radial-gradient(circle at 10% 85%, rgba(90, 10, 30, 0.12), transparent 30%),
                #090909;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            height: 78px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #242424;
            background: rgba(9, 9, 9, 0.92);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: #d51f45;
        }

        .voltar {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .voltar:hover {
            color: #fff;
        }

        main {
            min-height: calc(100vh - 78px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .container {
            width: 100%;
            max-width: 460px;
        }

        .label {
            color: #d51f45;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 52px;
            line-height: 0.95;
            letter-spacing: -2px;
            margin-bottom: 18px;
        }

        .descricao {
            color: #999;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .card {
            background: #111111;
            border: 1px solid #292929;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #cfcfcf;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border-radius: 13px;
            border: 1px solid #303030;
            outline: none;
            background: #191919;
            color: #fff;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #d51f45;
            box-shadow: 0 0 0 3px rgba(213, 31, 69, 0.12);
        }

        input::placeholder {
            color: #666;
        }

        button {
            width: 100%;
            height: 54px;
            margin-top: 8px;
            border: none;
            border-radius: 14px;
            background: #d51f45;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #ef2b54;
            transform: translateY(-1px);
        }

        #mensagem {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .login {
            text-align: center;
            margin-top: 24px;
            color: #777;
            font-size: 14px;
        }

        .login a {
            color: #d51f45;
            text-decoration: none;
            font-weight: 700;
        }

        .login a:hover {
            color: #ef2b54;
        }

        .rodape {
            text-align: center;
            margin-top: 22px;
            color: #555;
            font-size: 11px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 20px;
            }

            main {
                padding: 35px 18px;
            }

            h1 {
                font-size: 42px;
            }

            .card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        FoodNow<span>.</span>
    </div>

    <a href="/login.html" class="voltar">
        ← Voltar para login
    </a>
</header>

<main>

    <div class="container">

        <div class="label">
            FOODNOW / NOVA CONTA
        </div>

        <h1>
            Criar conta.
        </h1>

        <p class="descricao">
            Entre para descobrir restaurantes, montar pedidos
            e acompanhar tudo em um só lugar.
        </p>

        <div class="card">

            <form id="cadastroForm">

                <div class="campo">
                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@email.com"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        required
                    >
                </div>

                <button type="submit">
                    Criar minha conta →
                </button>

            </form>

            <div id="mensagem"></div>

        </div>

        <div class="login">
            Já possui uma conta?
            <a href="/login.html">Entrar</a>
        </div>

        <div class="rodape">
            FOODNOW • SUA COMIDA, SEU MOMENTO
        </div>

    </div>

</main>

<script>

    const form = document.getElementById("cadastroForm");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const nome =
            document.getElementById("nome").value;

        const email =
            document.getElementById("email").value;

        const senha =
            document.getElementById("senha").value;

        mensagem.textContent = "Criando sua conta...";
        mensagem.style.color = "#aaa";

        try {

            const resposta = await fetch("/users", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: nome,
                    email: email,
                    password: senha
                })
            });

            const dados = await resposta.json();

            if (!resposta.ok) {

                mensagem.textContent =
                    dados.error ||
                    "Não foi possível criar a conta.";

                mensagem.style.color = "#ff5b75";

                return;
            }

            mensagem.textContent =
                "Conta criada com sucesso!";

            mensagem.style.color = "#4ade80";

            setTimeout(() => {
                window.location.href = "/login.html";
            }, 1000);

        } catch (error) {

            console.error(error);

            mensagem.textContent =
                "Erro ao conectar com o servidor.";

            mensagem.style.color = "#ff5b75";
        }

    });

</script>

</body>
</html>
